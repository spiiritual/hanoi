[package]
name = "hanoi"
version = "0.1.0"
edition = "2024"
description = "Hanoi - a desktop music player for Plex (gpui rewrite)"
publish = false

[[bin]]
name = "hanoi"
path = "src/main.rs"

[dependencies]
# The crates.io `gpui` stopped at 0.2.2 (October 2025). `gpui-pre` republishes
# snapshots of Zed's gpui crates (the family gpui-kit / gpui-component build
# on); 0.3.4 is a Zed snapshot slightly past v1.19.2. The rename keeps
# `use gpui::..` working. Pinned exactly: snapshots make no semver promises.
# `gpui-unofficial` (Zed release tags) was tried first, but its 1.19.2 macOS
# build script cannot find gpui's sources in a crates.io checkout.
gpui = { package = "gpui-pre", version = "=0.3.4" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
# Keep `image` in step with the version gpui links so `RenderImage` frames
# can be built from decoded avatar bytes.
image = "0.25"
smallvec = "1"
# Artwork cache keys: a stable, collision-free digest of the token-free
# namespace + source + variant.
sha2 = "0.10"

[profile.dev]
# gpui is heavy; optimise dependencies even in dev so the window feels native.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# macOS-only, and only for `HANOI_SCREENSHOT`: locating this process' window in
# the window server so `screencapture -l <id>` can grab exactly that window.
# Both crates are already in the dependency graph via gpui.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
